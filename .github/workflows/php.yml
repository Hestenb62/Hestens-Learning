name: CI & PHP Quality Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    name: Lint & Validate PHP / JS / Data (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: json, mbstring
        tools: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: PHP Syntax Check (Lint all .php files)
      run: |
        echo "🔍 Checking PHP syntax across all project files..."
        find . -type f -name "*.php" ! -path "./vendor/*" ! -path "./.php_tmp/*" -exec php -l {} \;

    - name: Validate JSON Data Files
      run: |
        echo "🔍 Validating curriculum and assessment JSON data integrity..."
        php -r '
          $files = glob("data/*.json");
          foreach ($files as $file) {
            $content = file_get_contents($file);
            $json = json_decode($content, true);
            if ($json === null && json_last_error() !== JSON_ERROR_NONE) {
              fwrite(STDERR, "❌ Invalid JSON in $file: " . json_last_error_msg() . "\n");
              exit(1);
            }
            echo "✅ Valid JSON: $file\n";
          }
        '

    - name: JavaScript Syntax Check
      run: |
        echo "🔍 Checking JavaScript syntax..."
        for file in js/*.js; do
          if [ -f "$file" ]; then
            node --check "$file"
            echo "✅ Valid JS: $file"
          fi
        done

    - name: Test Local PHP Web Server
      run: |
        echo "🚀 Testing PHP built-in web server..."
        php -S 127.0.0.1:8000 &
        SERVER_PID=$!
        sleep 2
        
        # Test main pages
        curl -s -o /dev/null -w "index.php: HTTP %{http_code}\n" http://127.0.0.1:8000/index.php
        curl -s -o /dev/null -w "assessment.php: HTTP %{http_code}\n" http://127.0.0.1:8000/assessment.php
        curl -s -o /dev/null -w "grade.php: HTTP %{http_code}\n" http://127.0.0.1:8000/grade.php?level=1st
        curl -s -o /dev/null -w "about.php: HTTP %{http_code}\n" http://127.0.0.1:8000/about.php
        
        # Check HTTP 200 response on index
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/index.php)
        if [ "$HTTP_STATUS" -ne 200 ]; then
          echo "❌ Expected HTTP 200 on index.php, got $HTTP_STATUS"
          kill $SERVER_PID
          exit(1)
        fi
        
        echo "✅ All pages served successfully!"
        kill $SERVER_PID
